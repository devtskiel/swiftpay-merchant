services:
  - type: web
    name: swiftpay-merchant-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SWIFTPAY_BASE_URL
        value: https://api.pay.sandbox.live.swiftpay.ph/api/
      - key: SWIFTPAY_ALLOW_LIVE
        value: "false"
      - key: SWIFTPAY_ACCESS_KEY
        sync: false
      - key: SWIFTPAY_SECRET_KEY
        sync: false
      - key: SESSION_SIGNING_KEY
        sync: false
      - key: AUTH_ALLOWED_EMAILS
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: OTP_FROM_EMAIL
        sync: false